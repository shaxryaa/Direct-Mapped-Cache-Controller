name: Verify cache RTL and baseline
on:
  push:
  pull_request:
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install simulation and synthesis tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Run independent scoreboards, reset checks and baseline
        run: python3 scripts/run.py
      - name: Upload regression evidence
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: results/
